services:

  resourcesdb:
    # PostgreSQL 16 + pgvector (vector tables). Debian based: an existing ./data_store created with
    # postgres:16-alpine needs a one-off REINDEX (see database/migrations/003_create_resource_user_access.sql).
    image: pgvector/pgvector:pg16
    container_name: resourcesdb
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./data_store:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mcp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker-mcp
    ports:
      # Mapeamos el puerto definido en el env (ejemplo: 9093)
      - "${KAFKA_BROKER_PORT}:9092"
    environment:
    - .env
    restart: always
    volumes:
      - kafka_data_mcp:/data

  # Local embedding model (EMBEDDING_PROVIDER=ollama). Optional: only started with the "ollama" profile:
  #   docker compose --profile ollama up -d
  #   docker exec ollama ollama pull nomic-embed-text     # once; the model is kept in the volume
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles: ["ollama"]
    ports:
      - 11434:11434
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - mcp_network

volumes:
  ollama_models:
  kafka_data_mcp:
  data_store:

networks:
  mcp_network:
    driver: bridge