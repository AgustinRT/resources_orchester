services:

  resourcesdb:
    image: postgres:16-alpine
    container_name: resourcesdb
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - ./database/data_store:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mcp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker-mcp
    ports:
      # Mapeamos el puerto definido en el env (ejemplo: 9093)
      - "${KAFKA_BROKER_PORT}:9092"
    environment:
    - .env
    restart: always
    volumes:
      - kafka_data_mcp:/data

  # kafka-ui:
  #   image: ghcr.io/kafbat/kafka-ui:latest
  #   container_name: kafka-ui
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
  #     DYNAMIC_CONFIG_ENABLED: 'true'
  #   depends_on:
  #     - kafka
  #   volumes:
  #     - ~/kui/config.yml:/etc/kafkaui/dynamic_config.yaml

volumes:
  kafka_data_mcp:
  data_store:

networks:
  mcp_network:
    driver: bridge