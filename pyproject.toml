[project]
name = "resources-orchester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgustinRT", email = "a.rodilla.tierz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi[standard]>=0.142.2",
    "kafka-python>=3.0.11",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic[email,timezone]>=2.13.5",
    "sqlalchemy[asyncio]>=2.1.2",
    "testcontainers[kafka,postgres]>=4.15.0",
]

[project.scripts]
resources-orchester = "resources_orchester:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
